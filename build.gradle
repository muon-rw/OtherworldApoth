tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            modGroup       : modGroup,
            modid          : modid,
            version        : version,
            modName        : modName,
            author         : author,
            desc           : desc,
            mcVersion      : mc_version,
            mcVersionRange : mc_version_range,
            javaVersion    : javaVersion,
            neoVersion     : neo_version,
            neoVersionRange: neo_version_range,
            loaderRange    : loader_version_range
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : project.modName,
                "Specification-Vendor"    : project.author,
                "Specification-Version"   : archiveVersion,
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : archiveVersion,
                "Implementation-Vendor"   : project.author,
                "Built-On-Minecraft"      : project.mc_version
        ])
    }
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(GenerateModuleMetadata) {
    enabled = false
}

tasks.register('sendToModpack', Copy) {
    group = 'publishing'
    dependsOn 'jar'
    from tasks.jar.archiveFile
    into "C:\\Users\\renpi\\curseforge\\minecraft\\Instances\\Raven's High Fantasy\\mods"
    rename { String fileName ->
        fileName.replace(project.version.toString(), "dev")
    }
    doLast {
        println "Mod JAR sent to modpack folder: ${tasks.jar.archiveFileName.get()}"
    }
}

publishMods {
    file = tasks.jar.archiveFile
    modLoaders.add("neoforge")
    changelog = new File("$project.rootDir/CHANGELOG.md").getText('UTF-8')
    version = "${project.version}"
    type = BETA
    displayName = "NeoForge-${project.version}"

    curseforge {
        projectId = "${curseforge_project}"
        accessToken = System.getenv("CF_TOKEN")

        minecraftVersions.add("${mc_version}")
        javaVersions.add(JavaVersion.VERSION_21)

        client = true
        server = true

        requires("raven-core")
        requires("apotheosis")
        requires("apothic-attributes")
        requires("irons-spells-n-spellbooks")
        requires("apotheosis-x-irons-spellbooks-compat")
        requires("champions-unofficial")
        optional("justleveling-fork")
        requires("ancient-reforging")
        requires("dynamic-difficulty-mod")
    }
}

tasks.named('publishMods') {
    dependsOn 'publishAllPublicationsToMuonRepository'
}
tasks.withType(me.modmuss50.mpp.PublishModTask).configureEach {
    mustRunAfter 'publishAllPublicationsToMuonRepository'
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = 'raven-apoth'
            artifact(tasks.named('jar'))
            artifact(tasks.named('sourcesJar', Jar))
        }
    }
    repositories {
        maven {
            name = "Muon"
            url = uri(System.getenv("MAVEN_URL") ?: "https://maven.muon.rip/releases")
            credentials {
                username = System.getenv("MAVEN_USERNAME")
                password = System.getenv("MAVEN_PASSWORD")
            }
            authentication {
                create(BasicAuthentication)
            }
        }
        maven {
            name = 'localMaven'
            url = uri(System.getProperty("user.home") + "/.m2/repository")
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
