    // the current build; it is not published to any maven.
    compileOnly("pack:raven_dnd_origins:dev")
    localRuntime("pack:raven_dnd_origins:dev")
    localRuntime("curse.maven:apoli-1631826:8840848")
    localRuntime("curse.maven:o-origins-1636345:8840894")
    localRuntime("curse.maven:fzzy-config-1005914:7568897")
    localRuntime("curse.maven:kotlin-for-forge-351264:8335665")

