    localRuntime("curse.maven:mmmmmmmmmmmm-225738:8510632")
    // Adds the silver and gold coins for wanderer trades
    localRuntime("curse.maven:numismatic-overhaul-reforged-again-1294551:6801648")
    localRuntime("pack:block_factorys_bosses:2.1.2-neo-1.21.1")
    localRuntime("pack:simplyswords-neoforge:1.70.2-1.21.1")
    localRuntime("pack:simplytooltips-neoforge:0.1.5")
    localRuntime("pack:undead_unleashed:2.0.6-hotfix-neoforge-1.21.1")
    // localRuntime("pack:mythsandlegends:1.0.5")
    localRuntime("pack:gtbcs_geomancy_plus:1.1.0-1.21.1")
    localRuntime("pack:gtbcs_spell_lib:2.2.0-1.21.1")
    localRuntime("pack:discerning_the_eldritch:1.4.4-1.21")
    localRuntime("pack:aces_spell_utils:1.2.7.2-1.21.1")
    localRuntime("pack:azurelib-neo:1.21.1-3.1.11")
