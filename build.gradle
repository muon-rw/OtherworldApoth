    localRuntime("curse.maven:aether-villages-1073197:5895490")
    localRuntime("curse.maven:legendary-monsters-944035:8715533")
    localRuntime("dev.architectury:architectury-neoforge:${architectury_version}")
    localRuntime("curse.maven:dark-doppelganger-1110803:8472789")

