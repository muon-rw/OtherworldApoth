    // them "not a subtype" of the module-loaded interface (client crash at FMLLoadCompleteEvent).
    localRuntime("curse.maven:bookshelf-228525:7606240")  // required by attributefix
    localRuntime("vazkii.patchouli:Patchouli:${patchouli_version}")

    // Apotheosis. 1.21.1 split enchanting and spawners into their own modules.
    implementation("dev.shadowsoffire:Placebo:${mc_version}-${placebo_version}")
