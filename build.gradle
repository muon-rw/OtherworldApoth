    compileOnly("snownee.jade:Jade-NeoForge:${jade_version}")
    localRuntime("snownee.jade:Jade-NeoForge:${jade_version}")
    compileOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    localRuntime("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    localRuntime("dev.isxander:yet-another-config-lib:${yacl_version}")
    localRuntime("maven.modrinth:spark:${spark_version}")

    // Raven Core. Non-transitive so its dev runtime doesn't leak into here; its mods.toml requires
    // only aether_villages and legendary_monsters, and Aether Villages needs Architectury.
