plugins {
    id 'idea'
    id 'eclipse'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
    id 'dev.mixinmcp.decompile' version '1.5.0'
}

base {
    archivesName = fileName
}

group = project.properties.modGroup
version = "${project.properties.version}+${project.properties.mc_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(project.properties.javaVersion)

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.mc_version
        mappingsVersion = project.parchment_version
    }
    validateAccessTransformers = true

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            jvmArgument '-Xmx6G'
            jvmArgument '-Xms2G'
            jvmArgument '-XX:+UseG1GC'
            jvmArgument '-XX:MaxGCPauseMillis=200'
        }
        client {
            client()
            gameDirectory = project.file('run/client')
        }

        clientExtra {
            client()
            gameDirectory = project.file('run/client2')
            programArguments.addAll('--username', 'Dev2')
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }

        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll('--mod', modid, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath)
        }
    }

    mods {
        "${modid}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// Loom provides `localRuntime` out of the box; MDG does not, so wire it up here.
// Deps in `localRuntime` are on the dev runtime classpath but aren't exposed in
// `runtimeElements`, so they don't propagate transitively to maven consumers.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
    testRuntimeClasspath.extendsFrom(localRuntime)
}

repositories {
    mavenCentral()
    mavenLocal()
    flatDir {
        // Dev runtime only: jars pulled straight from the modpack instance so the dev pool matches
        // what the pack ships (Iron's Apothic, Ancient Reforging, spell addons, boss mods, ...).
        name = "RavenPackMods"
        dir "C:\\Users\\renpi\\curseforge\\minecraft\\Instances\\Raven's High Fantasy\\mods"
        content { includeGroup 'pack' }
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        // Curios, Caelus
        url "https://maven.theillusivec4.top"
        content {
            includeGroupByRegex "top\\.theillusivec4.*"
            includeGroupByRegex "com\\.illusivesoulworks.*"
        }
    }
    maven {
        // JEI, Patchouli
        url "https://maven.blamejared.com"
        content {
            includeGroup "vazkii.patchouli"
            includeGroupByRegex "net\\.darkhax.*"
            includeGroupByRegex "com\\.blamejared.*"
            includeGroup "mezz.jei"
        }
    }
    maven {
        // Shadows of Fire, Jade
        url "https://maven.shadowsoffire.dev/releases"
        content {
            includeGroup "dev.shadowsoffire"
            includeGroup "snownee.jade"
        }
    }
    maven { url 'https://maven.shedaniel.me/' }            // Cloth Config, Architectury
    maven { url 'https://maven.kosmx.dev/' }               // Player Animator
    maven { url = "https://maven.isxander.dev/releases" }  // YACL
    maven { url = "https://maven.muon.rip/releases" }      // Dynamic Difficulty, Raven Core
    maven { url = "https://code.redspace.io/releases" }    // Iron's
    maven { url = "https://code.redspace.io/snapshots" }
    maven { url = "https://maven.createmod.net" }          // Create, Ponder, Flywheel
    maven {
        // Registrate. MC1.21 builds only exist in /snapshots, not the /mirror repo.
        url = "https://maven.ithundxr.dev/snapshots"
        content {
            includeGroup "com.tterrag.registrate"
        }
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

