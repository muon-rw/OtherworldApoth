    // Health Bars replaces YDM's Mob Health Bar;
    localRuntime("curse.maven:health-bars-1367734:7122333")
    localRuntime("curse.maven:puzzles-lib-495476:8251525")
    localRuntime("pack:healthbars-dd-compat:0.3.0+1.21.1")

    // Ancient Reforging: Included in the pack, required
    localRuntime("pack:ancientreforging:1.8.5")
    localRuntime("pack:extra_apoth_compat:1.0.4")

    // Create, so the crushing recipes for affix items and gems are validated at runtime.
    localRuntime("com.simibubi.create:create-${mc_version}:${create_version}") { transitive = false }
    localRuntime("net.createmod.ponder:ponder-neoforge:${ponder_version}")
    localRuntime("dev.engine-room.flywheel:flywheel-neoforge-${mc_version}:${flywheel_version}")
    localRuntime("com.tterrag.registrate:Registrate:${registrate_version}")

    // Paxi, so the pack's config/paxi datapacks can be loaded in the dev server for registry dumps.
    localRuntime("pack:Paxi-1.21.1-NeoForge:5.1.3")
    localRuntime("pack:YungsApi-1.21.1-NeoForge:5.1.9")           // required by Paxi

    // RPGDO, and the AttributeSetter mod that applies its bundled item and mob attribute data
    compileOnly "curse.maven:rpgdamageoverhaul-1293843:8777705"
    // shelved: localRuntime "curse.maven:rpgdamageoverhaul-1293843:8777705"
    compileOnly "curse.maven:attribute-setter-1064034:8777532"
    // shelved: localRuntime "curse.maven:attribute-setter-1064034:8777532"

    // Content mods referenced by id from affix loot entries, wanderer trades and damage type tags.
    // Runtime only, so the entries can be validated against the real item ids.
    localRuntime("curse.maven:lendercataclysm-551586:8706841")
    localRuntime("curse.maven:lionfish-api-1001614:8345326")
    localRuntime("curse.maven:iceandfire-ce-1040076:${iceandfire_ce_file}")
    localRuntime("curse.maven:uranus-1010827:${uranus_file}")
    localRuntime("curse.maven:jupiter-1072905:${jupiter_file}")
    localRuntime("curse.maven:mowzies-mobs-250498:7760267")
    localRuntime("curse.maven:mowzies-cataclysm-1128348:8196282")
    localRuntime("curse.maven:aether-255308:7043502")
    localRuntime("curse.maven:aeroblender-879879:5911923")
    localRuntime("curse.maven:deep-aether-852465:7843283")
    localRuntime("maven.modrinth:owo-lib:0.12.15.5-beta.1+1.21")
    // Fb55Fgjz = accessories-neoforge-1.1.0-beta.53+1.21.1; the Aether's nested beta.48 fails in dev.
    localRuntime("maven.modrinth:accessories:Fb55Fgjz")
    localRuntime("curse.maven:terrablender-neoforge-940057:6054947")
