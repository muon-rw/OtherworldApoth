    implementation("dev.shadowsoffire:Apotheosis:${mc_version}-${apotheosis_version}")
    implementation("dev.shadowsoffire:ApothicEnchanting:${mc_version}-${apothic_enchanting_version}")
    localRuntime("dev.shadowsoffire:ApothicSpawners:${mc_version}-${apothic_spawners_version}")

    // Apothic Combat + Better Combat: extra loot categories for Better Combat weapon types.
    localRuntime("pack:apothiccombat:1.2.1")
    localRuntime("maven.modrinth:better-combat:${better_combat_version}")

    // Iron's Spells n Spellbooks + Iron's Apothic.
    // Iron's Apothic now has most of what was here before
    implementation("io.redspace:irons_spellbooks:${irons_version}")
    implementation("io.redspace:irons_lib:${irons_lib_version}")
    compileOnly("pack:irons_apothic:2.2.5")
    localRuntime("pack:irons_apothic:2.2.5")

    // Champions
    implementation("curse.maven:champions-unofficial-1074990:8593069")

    // Leveling; Dynamic Difficulty replaces Auto Leveling
    compileOnly("curse.maven:justleveling-fork-1073400:8555544")
